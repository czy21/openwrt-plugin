name: Deploy static

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    container:
      image: openwrt/imagebuilder:x86-64-main
      volumes:
        - openwrt-share:/data/
      options: --user root --privileged --pull always
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout firmware-selector-openwrt-org
        uses: actions/checkout@v6
        with: 
          repository: czy21/firmware-selector-openwrt-org
          path: feeds/firmware-selector-openwrt-org
          ref: "self"

      - name: Setup firmware-selector-openwrt-org config.json
        run: |
          cd feeds/firmware-selector-openwrt-org/www/
          sed -i "s;%GIT_VERSION%;$(git rev-parse --short HEAD);" js/main.js

      - name: Deploy firmware-selector-openwrt-org to OpenWrt Download Server
        shell: su buildbot -c "bash {0}"
        run: |
          rm -rf /data/firmware/*
          cp -rv feeds/firmware-selector-openwrt-org/www/* /data/firmware/

      - name: Checkout openwrt-download-page
        uses: actions/checkout@v6
        with: 
          repository: aparcar/openwrt-download-page
          path: feeds/openwrt-download-page

      - name: Deploy openwrt-download-page to OpenWrt Download Server
        shell: su buildbot -c "bash {0}"
        run: |
          cp -rv feeds/openwrt-download-page/dir-index.cgi /data/download/